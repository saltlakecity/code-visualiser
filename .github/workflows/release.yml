name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Add Go bin to PATH
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production installer
        run: wails build -clean -nsis -trimpath

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/visualisator.exe -DestinationPath build/bin/visualisator-portable.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/visualisator-amd64-installer.exe
            build/bin/visualisator.exe
            build/bin/visualisator-portable.zip
